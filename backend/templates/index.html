<!DOCTYPE html><html><head><meta charset="utf-8"/><title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Search, tag, rate, and fork shared prompts.</p>
<form method="get" action="/"><input name="q" value="{{ q }}" placeholder="Search"/><input name="tag" value="{{ tag }}" placeholder="tag"/><button type="submit">Filter</button></form>
<div class="grid"><section class="card"><h2>Add prompt</h2><form method="post" action="/ui/prompts"><input name="title" required/><textarea name="body" rows="4"></textarea><input name="tags" placeholder="sales,onboarding"/><button type="submit">Save</button></form></section>
<section class="card"><h2>Library</h2>{% for p in prompts %}<article class="card"><h3>{{ p.title }}</h3><p class="sub">{% for t in p.tags.split(',') if t %}<span class="pill">{{ t }}</span>{% endfor %}</p>
<pre>{{ p.body[:400] }}</pre><form method="post" action="/ui/fork"><input type="hidden" name="prompt_id" value="{{ p.id }}"/><button type="submit" class="secondary">Fork</button></form></article>{% else %}<p class="sub">No prompts yet.</p>{% endfor %}</section></div></main></body></html>
